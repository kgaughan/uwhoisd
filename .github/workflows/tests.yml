---
name: Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.0"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: 
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.1
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --frozen pytest --cov=uwhoisd --cov-report=term
